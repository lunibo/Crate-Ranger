# Baut Crate Ranger für Windows und Linux und veröffentlicht ein GitHub-Release,
# sobald ein Versions-Tag gepusht wird:  git tag v1.2.3 && git push origin v1.2.3
# Tags mit Bindestrich (z.B. v1.3.0-beta.1) werden als Pre-Release veröffentlicht.
# Manuell (Actions → Release → Run workflow) wird nur gebaut, ohne Veröffentlichung.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  check:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Tag-Format prüfen
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' ist keine gültige Version (erwartet z.B. v1.2.3 oder v1.3.0-beta.1)"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: win
            targets: portable nsis
          - name: Linux
            os: ubuntu-latest
            platform: linux
            targets: AppImage deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Version aus Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: App bauen
        run: npm run build
      - name: Pakete erstellen
        shell: bash
        run: >-
          npx electron-builder --${{ matrix.platform }} ${{ matrix.targets }} --x64 --publish never
          -c.extraMetadata.homepage="${{ github.server_url }}/${{ github.repository }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-ranger-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

  release:
    name: GitHub-Release veröffentlichen
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: crate-ranger-*
          merge-multiple: true
      - name: Prüfsummen erstellen
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release-Text erstellen
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<NOTES
          ## Downloads

          | System | Datei | Hinweis |
          |---|---|---|
          | Windows | \`CrateRanger-${V}-setup.exe\` | Installer (Startmenü, Deinstallation) |
          | Windows | \`CrateRanger-${V}-portable.exe\` | ohne Installation, direkt starten |
          | Linux | \`CrateRanger-${V}-x86_64.AppImage\` | alle Distributionen: \`chmod +x\` und starten |
          | Debian/Ubuntu | \`crate-ranger_${V}_amd64.deb\` | \`sudo apt install ./crate-ranger_${V}_amd64.deb\` |

          Die Windows-Dateien sind nicht code-signiert – Windows SmartScreen fragt daher beim ersten Start nach
          („Weitere Informationen“ → „Trotzdem ausführen“). Prüfsummen: \`SHA256SUMS.txt\`.

          > Crate Ranger ist ein inoffizieller Client und steht in keiner Verbindung zu SoundScout, Monstercat oder
          > Create Music Group. Downloads sind nur im Rahmen des eigenen SoundScout-Plans möglich.
          NOTES
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Crate Ranger ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/SHA256SUMS.txt
