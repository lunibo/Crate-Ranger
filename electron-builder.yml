appId: app.crateranger.desktop
productName: Crate Ranger
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
afterPack: scripts/after-pack.cjs
win:
  # Standard: portable .exe (baut auch unter Linux/WSL ohne wine).
  # Installer (nsis) per `npm run dist:win:installer` – benötigt Windows oder wine.
  target:
    - target: portable
      arch: [x64]
  icon: resources/icon.ico
  # Icon/Versionsinfos setzt scripts/after-pack.cjs per rcedit (funktioniert auch unter WSL ohne wine)
  signAndEditExecutable: false
portable:
  artifactName: CrateRanger-${version}-portable.exe
nsis:
  artifactName: CrateRanger-${version}-setup.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: resources/icon.png
  category: Audio
  executableName: crate-ranger
  synopsis: Unofficial desktop client for SoundScout
  description: Crate Ranger is an unofficial desktop client for SoundScout with streaming, downloads, full tagging and library management.
  maintainer: Crate Ranger
appImage:
  artifactName: CrateRanger-${version}-x86_64.AppImage
deb:
  artifactName: crate-ranger_${version}_amd64.deb
# Veröffentlichung übernimmt der GitHub-Workflow (.github/workflows/release.yml)
publish: null
