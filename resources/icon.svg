    </clipPath>
  </defs>

  <rect x="36" y="36" width="952" height="952" rx="212" fill="url(#tile)" stroke="#2b3753" stroke-width="6"/>
       <ellipse cx="512" cy="470" rx="380" ry="330" fill="url(#glow)"/>
  <g transform="">


  <!-- Vinyl-Platte -->
