  <circle cx="512" cy="492" r="245" fill="none" stroke="#232b3d" stroke-width="6"/><circle cx="512" cy="492" r="222" fill="none" stroke="#232b3d" stroke-width="6"/><circle cx="512" cy="492" r="199" fill="none" stroke="#232b3d" stroke-width="6"/><circle cx="512" cy="492" r="176" fill="none" stroke="#232b3d" stroke-width="6"/><circle cx="512" cy="492" r="153" fill="none" stroke="#232b3d" stroke-width="6"/>
  <circle cx="512" cy="492" r="272" fill="url(#shine)"/>
  <circle cx="512" cy="492" r="96" fill="url(#label)"/>
  <circle cx="512" cy="492" r="64" fill="none" stroke="#0f6e5c" stroke-opacity=".35" stroke-width="6"/>
  <circle cx="512" cy="492" r="15" fill="#10141e"/>

  <!-- Kistenfront -->
  <rect x="196" y="596" width="632" height="292" rx="30" fill="url(#wood)"/>
  <rect x="196" y="596" width="632" height="292" rx="30" fill="none" stroke="#7a4a22" stroke-width="10"/>
  <rect x="196" y="700" width="632" height="12" fill="#7a4a22"/>
       <rect x="196" y="792" width="632" height="12" fill="#7a4a22"/>
       <circle cx="250" cy="660" r="9" fill="#4c2c12"/><circle cx="250" cy="842" r="9" fill="#4c2c12"/><circle cx="774" cy="660" r="9" fill="#4c2c12"/><circle cx="774" cy="842" r="9" fill="#4c2c12"/>
  <rect x="446" y="628" width="132" height="38" rx="19" fill="#4c2c12"/>

  <!-- Ranger-Hut, leicht schräg auf der Platte -->
