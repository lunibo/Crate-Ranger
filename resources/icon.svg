<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Crate Ranger">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18233a"/><stop offset="1" stop-color="#080c14"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#36d6b4" stop-opacity=".28"/><stop offset="1" stop-color="#36d6b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="label" cx=".4" cy=".35" r=".8">
